---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ingress-nginx
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
      version: 4.11.3
  install:
    createNamespace: true
  dependsOn:
    - name: cilium
  interval: 1h0m0s
  releaseName: ingress-nginx
  targetNamespace: ingress-nginx
  values:
    controller:
      replicaCount: 1
      service:
        type: LoadBalancer
