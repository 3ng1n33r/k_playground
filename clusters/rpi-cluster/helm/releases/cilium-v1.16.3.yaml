---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cilium
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.16.3
  interval: 1m0s
  releaseName: cilium
  targetNamespace: kube-system
  values:
    k8sClientRateLimit:
      burst: 100
      qps: 50
    k8sServiceHost: cluster-endpoint
    k8sServicePort: "8443"
    kubeProxyReplacement: "true"
    l2announcements:
      enabled: true
