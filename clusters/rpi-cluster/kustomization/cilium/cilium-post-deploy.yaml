---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-post-deploy
  namespace: flux-system
spec:
  dependsOn:
    - kind: HelmRelease  
      name: cilium
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./clusters/rpi-cluster/post-deploy/cilium"
  interval: 60m
  timeout: 5m
  prune: true
  wait: true
