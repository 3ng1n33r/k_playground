---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-deploy
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-post-deploy
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./infra/deploy/cni"
  interval: 60m
  timeout: 5m
  prune: true
  wait: true
