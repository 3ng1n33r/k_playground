---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manifests-pre-deploy
  namespace: flux-system
spec:
  dependsOn:
    - name: base-pre-deploy
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./infra/pre-deploy/manifests"
  interval: 60m
  timeout: 5m
  prune: true
  wait: true
