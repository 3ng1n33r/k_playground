---
# ansible-playbook -i inventory/hosts.yaml runbooks/upgrade_node.yaml -u pi --private-key=~/.ssh/ansible -CD
- name: Runbooks | Upgrade Kubernetes on other nodes.
  hosts: all,!master[0]
  serial: 1
  become: true
  tasks:
    - name: Get package facts.
      ansible.builtin.package_facts:
        manager: apt

    - name: Set the fact to the current kubeadm version.
      ansible.builtin.set_fact:
        kubeadm_version: "{{ ansible_facts.packages['kubeadm'][0].version.split('-')[0] }}"
        kubernetes_version: "{{ kubernetes_pkg_version.split('-')[0] }}"

    - name: Сompare the current version with the desired one.
      ansible.builtin.debug:
        msg: "current version: {{ kubeadm_version }}, required version: {{ kubernetes_version }}"

    - name: Upgrade cluster.
      when: kubeadm_version is version(kubernetes_version, '<', version_type='semver')
      block:
        - name: Only run "update_cache=yes" if the last one is more than 3600 seconds ago.
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600

        - name: Allow Kubeadm to be upgraded.
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: install
          with_items:
            - kubeadm

        - name: Install Kubeadm.
          ansible.builtin.apt:
            name:
              - kubeadm={{ kubernetes_pkg_version }}
            state: present

        - name: Upgrading node.
          ansible.builtin.shell: "kubeadm upgrade node > node_upgrade_v{{ kubernetes_version }}.log 2>&1"
          args:
            chdir: /home/{{ ansible_user }}
            creates: node_upgrade_v{{ kubernetes_version }}.log

        - name: Drain node.
          local_action: ansible.builtin.command kubectl drain {{ ansible_hostname }} --ignore-daemonsets --delete-emptydir-data
          ignore_errors: true
          become: false

        - name: Pause 180 second for Pod eviсtion.
          ansible.builtin.pause:
            seconds: 180

        - name: Allow Kubectl, Kubelet to be upgraded.
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: install
          with_items:
            - kubelet
            - kubectl

        - name: Install Kubectl, Kubelet.
          ansible.builtin.apt:
            name:
              - kubelet={{ kubernetes_pkg_version }}
              - kubectl={{ kubernetes_pkg_version }}
            state: present

        - name: Prevent Kubeadm, Kubectl, Kubelet from being upgraded.
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: hold
          with_items:
            - kubeadm
            - kubelet
            - kubectl

        - name: Restart service kubelet, also issue daemon-reload to pick up config changes.
          ansible.builtin.systemd_service:
            state: restarted
            daemon_reload: true
            name: kubelet

        - name: Uncordon node.
          local_action: ansible.builtin.command kubectl uncordon {{ ansible_hostname }}
          become: false
