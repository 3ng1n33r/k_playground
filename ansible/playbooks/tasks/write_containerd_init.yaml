---
- name: Make directory.
  ansible.builtin.file:
    path: "/etc/systemd/system/containerd.service.d"
    state: directory
    mode: '0755'
    owner: root

- name: Write kubelet systemd init file.
  ansible.builtin.template:
    src: "containerd-override.conf.j2"
    dest: "/etc/systemd/system/containerd.service.d/override.conf"
    backup: true
    mode: '0644'
    owner: root
  notify: Reload systemd.

- name: Create runtime.slice systemd unit.
  ansible.builtin.copy:
    dest: "/etc/systemd/system/runtime.slice"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Container Runtime Slice

      [Slice]
  when: cri_cgroups_for_service_slice is defined
  notify: Reload systemd.
