---
- name: Copy certs to masters.
  when: "'master' in group_names"
  block:
    - name: Copy etcd CA files.
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ kube_cert_dir }}/etcd/{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: root
      loop:
        - { src: "cfssl/etcd-ca.crt", dest: "ca.crt", mode: "0644" }
        - { src: "cfssl/etcd-ca.key", dest: "ca.key", mode: "0600" }

    - name: Copy apiserver-etcd-client files.
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ kube_cert_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: root
      loop:
        - { src: "cfssl/apiserver-etcd-client.crt", dest: "apiserver-etcd-client.crt", mode: "0644" }
        - { src: "cfssl/apiserver-etcd-client.key", dest: "apiserver-etcd-client.key", mode: "0600" }

- name: Copy certs to etcd nodes.
  when: "'etcd' in group_names"
  block:
    - name: Copy root-etcd-client files.
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ etcd_cert_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: "{{ etcd_owner }}"
      loop:
        - { src: "cfssl/root-etcd-client.crt", dest: "root-etcd-client.crt", mode: "0644" }
        - { src: "cfssl/root-etcd-client.key", dest: "root-etcd-client.key", mode: "0600" }

    - name: Copy etcd-ca files.
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ etcd_cert_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: "{{ etcd_owner }}"
      loop:
        - { src: "cfssl/etcd-ca.crt", dest: "ca.crt", mode: "0644" }
        - { src: "cfssl/etcd-ca.key", dest: "ca.key", mode: "0600" }

    - name: Copy etcd-server files.
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ etcd_cert_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: "{{ etcd_owner }}"
      loop:
        - { src: "cfssl/{{ ansible_hostname }}-etcd-server.crt", dest: "server.crt", mode: "0644" }
        - { src: "cfssl/{{ ansible_hostname }}-etcd-server.key", dest: "server.key", mode: "0600" }

    - name: Copy etcd-peer files.
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ etcd_cert_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
        owner: "{{ etcd_owner }}"
      loop:
        - { src: "cfssl/{{ ansible_hostname }}-etcd-peer.crt", dest: "peer.crt", mode: "0644" }
        - { src: "cfssl/{{ ansible_hostname }}-etcd-peer.key", dest: "peer.key", mode: "0600" }
