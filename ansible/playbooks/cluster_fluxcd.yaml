---
- name: Playbook to install Flux.
  hosts: master[0]
  become: true
  tasks:
    - name: Check Flux binary exist.
      ansible.builtin.stat:
        path: "{{ bin_dir }}/flux"
      register: flux_check

    - name: Download Flux cli.
      ansible.builtin.unarchive:
        src: https://github.com/fluxcd/flux2/releases/download/v{{ flux_version }}/flux_{{ flux_version }}_linux_{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}.tar.gz
        dest: /tmp
        remote_src: true
        mode: '0755'
      when: not flux_check.stat.exists

    - name: Copy Flux binary to /usr/local/bin.
      ansible.builtin.copy:
        src: /tmp/flux
        dest: "{{ bin_dir }}/flux"
        remote_src: true
        mode: '0755'
      when: not flux_check.stat.exists

    - name: Initialize Flux.
      ansible.builtin.shell: flux bootstrap gitlab --deploy-token-auth --owner={{ gitlab_user }} --repository={{ flux_gitlab_repo }} --branch={{ flux_gitlab_branch }} --path={{ flux_gitlab_path }} --personal > flux_initialized.log 2>&1
      environment:
        GITLAB_TOKEN: "{{ gitlab_pat }}"
        GITLAB_USER: "{{ gitlab_user }}"
        KUBECONFIG: /etc/kubernetes/admin.conf
      args:
        chdir: /home/{{ ansible_user }}
        creates: flux_initialized.log

    - name: Check Kubeseal binary exist.
      ansible.builtin.stat:
        path: "{{ bin_dir }}/kubeseal"
      register: kubeseal_check

    - name: Download Kubeseal.
      ansible.builtin.unarchive:
        src: https://github.com/bitnami-labs/sealed-secrets/releases/download/v{{ kubeseal_version }}/kubeseal-{{ kubeseal_version }}-linux-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}.tar.gz
        dest: /tmp
        remote_src: true
        mode: '0755'
      when: not kubeseal_check.stat.exists

    - name: Copy Kubeseal binary to /usr/local/bin.
      ansible.builtin.copy:
        src: /tmp/kubeseal
        dest: "{{ bin_dir }}/kubeseal"
        remote_src: true
        mode: '0755'
      when: not kubeseal_check.stat.exists
