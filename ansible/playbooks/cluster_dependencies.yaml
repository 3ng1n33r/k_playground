---
- name: Install dependencies on all hosts.
  hosts: all
  become: true
  tasks:
    # Upgrade the OS

    - name: Only run "update_cache=yes" if the last one is more than 3600 seconds ago.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade OS.
      when: upgrade_os | default(false) | bool
      block:
        - name: Upgrade the OS (apt-get dist-upgrade).
          ansible.builtin.apt:
            upgrade: dist
    
        - name: Check if a reboot is needed.
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /var/run/reboot-required
            - /var/run/reboot-required.pkgs
          register: reboot_required_files
    
        - name: Reboot, if needed.
          ansible.builtin.reboot:
          when: reboot_required_files.results | selectattr('stat.exists') | list | length > 0
    
        - name: Remove dependencies that are no longer required.
          ansible.builtin.apt:
            autoremove: true

    # Disable SWAP

    - name: Disable SWAP.
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable SWAP in fstab.
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    # Install modules and add kernel settings

    - name: Load kernel modules.
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop:
        - br_netfilter
        - overlay

    - name: Create file /etc/sysctl.d/kubernetes.conf.
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: '1'
        sysctl_file: /etc/sysctl.d/kubernetes.conf
        reload: true
      loop:
        - net.bridge.bridge-nf-call-ip6tables
        - net.bridge.bridge-nf-call-iptables
        - net.ipv4.ip_forward

    # Install Containerd

    - name: Install required packages.
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present

    - name: Add Docker apt-key.
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker-apt-keyring.asc
        mode: '0644'
        force: true

    - name: Add Docker's APT repo.
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker-apt-keyring.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        update_cache: true

    - name: Unhold packages.
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubeadm
        - kubelet
        - kubectl
        - containerd.io
      ignore_errors: true

    - name: Install Containerd.
      ansible.builtin.apt:
        name: containerd.io={{ containerd_pkg_version }}
        state: present
      notify:
        - Generate Containerd config.

    - name: Force all notified handlers to run at this point.
      ansible.builtin.meta: flush_handlers

    - name: Configuring Systemd cgroup driver for Containerd.
      ansible.builtin.lineinfile:
        path: "{{ containerd_config_dir }}/config.toml"
        regexp: '            SystemdCgroup = false'
        line: '            SystemdCgroup = true'
      notify: Restart containerd.

    - name: Configuring Pause image version.
      ansible.builtin.lineinfile:
        path: "{{ containerd_config_dir }}/config.toml"
        regexp: '^    sandbox_image'
        line: '    sandbox_image = "{{ sandbox_image }}"'
      notify: Restart containerd.

    - name: Enable and start the Containerd service.
      ansible.builtin.systemd_service:
        name: containerd
        state: started
        enabled: true

    # Install kubeadm, kubelet, Kubectl

    - name: Add Kubernetes apt-key.
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_release }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'
        force: true

    - name: Add Kubernetes APT repository.
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_release }}/deb/ /"
        state: present
        update_cache: true

    - name: Install Kubeadm, Kubelet packages.
      ansible.builtin.apt:
        name:
          - kubelet={{ kubernetes_pkg_version }}
          - kubeadm={{ kubernetes_pkg_version }}
          - kubectl={{ kubernetes_pkg_version }}
        state: present

    - name: Hold Kubeadm, Kubelet packages.
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
        - containerd.io

  handlers:
    - name: Generate Containerd config.
      ansible.builtin.shell: /usr/bin/containerd config default > {{ containerd_config_dir }}/config.toml
      changed_when: false

    - name: Restart containerd.
      ansible.builtin.service:
        name: containerd
        state: restarted
