---
- name: Make kubernetes directory.
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: '0751'
    owner: root

- name: Make manifests directory.
  ansible.builtin.file:
    path: /etc/kubernetes/manifests
    state: directory
    mode: '0700'
    owner: root

- name: Make haproxy directory.
  ansible.builtin.file:
    path: /etc/haproxy
    state: directory
    mode: '0755'
    owner: root

- name: Write haproxy configuration.
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    mode: '0644'
    backup: true

- name: Write static pod.
  ansible.builtin.template:
    src: haproxy.manifest.j2
    dest: /etc/kubernetes/manifests/haproxy.yaml
    mode: '0600'
