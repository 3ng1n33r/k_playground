---
- name: Configure join commands on first master node.
  hosts: master[0]
  become: true
  gather_facts: false
  tasks:
    - name: Include task to change the LB IP.
      ansible.builtin.include_tasks: tasks/change_lb_ip.yaml
      when: "groups['master'] | length > 1"

    - name: Storing the certificates in secret.
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      register: certificate_key_raw
      changed_when: false
      when: "groups['master'] | length > 1"

    - name: Set certificate key fact.
      ansible.builtin.set_fact:
        certificate_key: "{{ certificate_key_raw.stdout_lines[-1] }}"
      when: "groups['master'] | length > 1"

    - name: Retrieve join command.
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: Set join command fact.
      ansible.builtin.set_fact:
        join_command: "{{ join_command_raw.stdout_lines[0] }}"

- name: Join master nodes.
  hosts: master[1:]
  serial: 1
  become: true
  gather_facts: false
  tasks:
    - name: Check the availability api server port.
      ansible.builtin.wait_for:
        host: "{{ loadbalancer_apiserver_fqdn }}"
        port: "{{ loadbalancer_apiserver_port }}"

    - name: Join master node to cluster.
      ansible.builtin.shell: "{{ hostvars[groups['master'][0]].join_command }} --control-plane --certificate-key {{ hostvars[groups['master'][0]].certificate_key }} > node_joined.log 2>&1"
      args:
        chdir: /home/{{ ansible_user }}
        creates: node_joined.log

    - name: Wait for port to become open on the host.
      ansible.builtin.wait_for:
        port: "{{ loadbalancer_apiserver_port }}"
        delay: 30

    - name: Include task to change the LB IP.
      ansible.builtin.include_tasks: tasks/change_lb_ip.yaml

    - name: Include kubeconfig copy tasks.
      ansible.builtin.include_tasks: tasks/copy_kubeconfig.yaml

- name: Join worker nodes.
  hosts: worker
  serial: 1
  become: true
  gather_facts: false
  tasks:
    - name: Check the availability api server port.
      ansible.builtin.wait_for:
        host: "{{ loadbalancer_apiserver_fqdn if (groups['master'] | length > 1) else groups['master'][0] }}"
        port: "{{ loadbalancer_apiserver_port if (groups['master'] | length > 1) else '6443' }}"

    - name: Join worker node to cluster.
      ansible.builtin.shell: "{{ hostvars[groups['master'][0]].join_command }} > node_joined.log 2>&1"
      args:
        chdir: /home/{{ ansible_user }}
        creates: node_joined.log

    - name: Wait for port to become open on the host.
      ansible.builtin.wait_for:
        port: "{{ loadbalancer_apiserver_port }}"
        delay: 30
      when: "groups['master'] | length > 1"

    - name: Include task to change the LB IP.
      ansible.builtin.include_tasks: tasks/change_lb_ip.yaml
      when: "groups['master'] | length > 1"
