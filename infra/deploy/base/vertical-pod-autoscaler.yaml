---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cowboysysop
  namespace: flux-system
spec:
  interval: 24h0m0s
  url: https://cowboysysop.github.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vertical-pod-autoscaler
  namespace: flux-system
spec:
  chart:
    spec:
      chart: vertical-pod-autoscaler
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cowboysysop
      version: 10.2.1
  install:
    createNamespace: true
  dependsOn:
    - name: metrics-server
  interval: 30m0s
  releaseName: vertical-pod-autoscaler
  targetNamespace: vpa
  values:
    admissionController:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      extraArgs:
        --feature-gates=InPlaceOrRecreate=true
    recommender:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    updater:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      extraArgs:
        --feature-gates=InPlaceOrRecreate=true
