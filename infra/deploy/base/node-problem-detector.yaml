---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: deliveryhero
  namespace: flux-system
spec:
  interval: 24h0m0s
  url: https://charts.deliveryhero.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-problem-detector
  namespace: flux-system
spec:
  chart:
    spec:
      chart: node-problem-detector
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: deliveryhero
      version: 2.3.14
  interval: 30m0s
  releaseName: node-problem-detector
  targetNamespace: kube-system
  values:
    settings:
      heartBeatPeriod: 5m0s
      custom_monitor_definitions:
        kernel-monitor.json: |
          {
              "plugin": "kmsg",
              "logPath": "/dev/kmsg",
              "lookback": "5m",
              "bufferSize": 10,
              "source": "kernel-monitor",
              "metricsReporting": true,
              "conditions": [
                  {
                      "type": "KernelDeadlock",
                      "reason": "KernelHasNoDeadlock",
                      "message": "kernel has no deadlock"
                  },
                  {
                      "type": "ReadonlyFilesystem",
                      "reason": "FilesystemIsNotReadOnly",
                      "message": "Filesystem is not read-only"
                  }
              ],
              "rules": [
                  {
                      "type": "temporary",
                      "reason": "OOMKilling",
                      "pattern": "Kill process \\d+ (.+) score \\d+ or sacrifice child\\nKilled process \\d+ (.+) total-vm:\\d+kB, anon-rss:\\d+kB, file-rss:\\d+kB.*"
                  },
                  {
                      "type": "temporary",
                      "reason": "TaskHung",
                      "pattern": "task \\S+:\\w+ blocked for more than \\w+ seconds\\."
                  },
                  {
                      "type": "temporary",
                      "reason": "UnregisterNetDevice",
                      "pattern": "unregister_netdevice: waiting for \\w+ to become free. Usage count = \\d+"
                  },
                  {
                      "type": "temporary",
                      "reason": "KernelOops",
                      "pattern": "BUG: unable to handle kernel NULL pointer dereference at .*"
                  },
                  {
                      "type": "temporary",
                      "reason": "KernelOops",
                      "pattern": "divide error: 0000 \\[#\\d+\\] SMP"
                  },
                  {
                      "type": "temporary",
                      "reason": "MemoryReadError",
                      "pattern": "CE memory read error .*"
                  },
                  {
                      "type": "temporary",
                      "reason": "Ext4Error",
                      "pattern": "EXT4-fs error .*"
                  },
                  {
                      "type": "temporary",
                      "reason": "Ext4Warning",
                      "pattern": "EXT4-fs warning .*"
                  },
                  {
                      "type": "temporary",
                      "reason": "IOError",
                      "pattern": "Buffer I/O error .*"
                  },
                  {
                      "type": "permanent",
                      "condition": "KernelDeadlock",
                      "reason": "AUFSUmountHung",
                      "pattern": "task umount\\.aufs:\\w+ blocked for more than \\w+ seconds\\."
                  },
                  {
                      "type": "permanent",
                      "condition": "ReadonlyFilesystem",
                      "reason": "FilesystemIsReadOnly",
                      "pattern": "Remounting filesystem read-only"
                  }
              ]
          }
      log_monitors:
        - /custom-config/kernel-monitor.json
#        - /config/kernel-monitor.json
#        - /config/systemd-monitor.json
#      custom_plugin_monitors:
#        - /config/health-checker-containerd.json
    image:
      repository: registry.k8s.io/node-problem-detector/node-problem-detector
      tag: v0.8.20
    resources:
      limits:
        cpu: 10m
        memory: 80Mi
      requests:
        cpu: 10m
        memory: 80Mi
#    extraVolumes:
#      - name: containerd
#        hostPath:
#          path: /var/run/containerd/containerd.sock
#          type: Socket
#    extraVolumeMounts:
#      - mountPath: /var/run/containerd/containerd.sock
#        name: containerd
