---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cilium
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.19.1
  dependsOn:
    - name: kube-prometheus-stack
  interval: 30m
  releaseName: cilium
  targetNamespace: kube-system
  values:
    config:  
      ipv4ServiceRange: "10.96.0.0/12"
    rollOutCiliumPods: false
    gatewayAPI:
      enabled: true
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList: ["172.16.0.0/16"]
        clusterPoolIPv4MaskSize: 24
    ipv4:
      enabled: true
    envoy:
      enabled: false
    operator:
      rollOutPods: false
      replicas: 2
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
    k8sClientRateLimit:
      burst: 100
      qps: 50
    k8sServiceHost: cluster-endpoint
    k8sServicePort: 8443
    ipv4NativeRoutingCIDR: 172.16.0.0/16
    kubeProxyReplacement: true
    autoDirectNodeRoutes: true
    bpfClockProbe: true
    routingMode: native
    bpf:
      datapathMode: netkit
      masquerade: true
      mapDynamicSizeRatio: 0.08
      distributedLRU:
        enabled: true
    l2announcements:
      enabled: true
#    localRedirectPolicies:
#      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    hubble:
      enabled: false
      relay:
        enabled: false
      ui:
        enabled: false
        ingress:
          enabled: false
          className: "nginx"
          hosts:
            - hubble-ui.192.168.31.8.sslip.io
      metrics:
        enableOpenMetrics: false
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        serviceMonitor:
          enabled: false
        dashboards:
          enabled: false
          label: grafana_dashboard
          labelValue: "1"
