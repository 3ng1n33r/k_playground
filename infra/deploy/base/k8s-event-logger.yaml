---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: deliveryhero
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/deliveryhero/helm-charts
  ref:
    tag: 1.1.10
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: k8s-event-logger
  namespace: flux-system
spec:
  chart:
    spec:
      chart: k8s-event-logger
      sourceRef:
        kind: OCIRepository
        name: deliveryhero
  interval: 30m
  releaseName: k8s-event-logger
  targetNamespace: logs
  values:
    containerName: k8s-event-logger
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
