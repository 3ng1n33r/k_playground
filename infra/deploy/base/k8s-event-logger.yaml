---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: deliveryhero
  namespace: flux-system
spec:
  interval: 24h0m0s
  url: https://charts.deliveryhero.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-event-logger
  namespace: flux-system
spec:
  chart:
    spec:
      chart: k8s-event-logger
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: deliveryhero
      version: 1.1.8
  dependsOn:
    - name: loki
  interval: 30m0s
  releaseName: k8s-event-logger
  targetNamespace: logs
  values:
    containerName: k8s-event-logger
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
