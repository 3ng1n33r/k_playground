---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ingress-nginx
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
      version: 4.12.0
  dependsOn:
    - name: cilium
  install:
    createNamespace: true
  interval: 30m
  releaseName: ingress-nginx
  targetNamespace: ingress-nginx
  values:
    controller:
      replicaCount: 1
      service:
        type: LoadBalancer
        annotations:
          "lbipam.cilium.io/ips": "192.168.31.8"
