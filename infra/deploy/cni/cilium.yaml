---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cilium
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.18.2
  interval: 30m
  releaseName: cilium
  targetNamespace: kube-system
  values:
    envoy:
      enabled: false
    operator:
      replicas: 2
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
    k8sClientRateLimit:
      burst: 100
      qps: 50
    k8sServiceHost: cluster-endpoint
    k8sServicePort: 8443
    kubeProxyReplacement: true
    ipv4NativeRoutingCIDR: 10.0.0.0/8
    autoDirectNodeRoutes: true
    routingMode: native
    ipv4:
      enabled: true
    bpf:
      datapathMode: netkit
      masquerade: true
    l2announcements:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
        ingress:
          enabled: true
          className: "nginx"
          hosts:
            - hubble-ui.192.168.31.8.sslip.io
      metrics:
        enableOpenMetrics: true
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
