---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: 70.8.0
  dependsOn:
    - name: sealed-secrets-controller
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  interval: 30m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  values:
    grafana:
      enabled: true
      defaultDashboardsEnabled: true
      ingress:
        enabled: true
        hosts:
          - grafana.192.168.31.8.sslip.io
        ingressClassName: nginx
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
          labelValue: "1"
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki-gateway.loki.svc.cluster.local
          editable: true
          basicAuth: false
          access: proxy
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: telegram-alert
          group_by: ['alertname', 'cluster', 'service']
          group_interval: 5m
          repeat_interval: 12h
          group_wait: 30s
          routes:
            - match_re:
                severity: "warning|critical"
              receiver: telegram-alert
        receivers:
          - name: telegram-alert
            telegram_configs:
              - api_url: 'https://api.telegram.org'
                bot_token_file: /etc/alertmanager/secrets/alertmanager-secret-files/telegram-bot-token
                chat_id: -880628191
                send_resolved: true
                message: '{{ template "telegram.default.message" . }}'
      templateFiles:
        telegram.tmpl: |-
          {{ define "telegram.default.message" }}
          {{ if eq .Status "firing" }}
            {{ if eq .CommonLabels.severity "critical" }}&#128308 <b>Alert:</b> {{ .CommonLabels.alertname }}
            {{ else if eq .CommonLabels.severity "warning" }}&#128992 <b>Alert:</b> {{ .CommonLabels.alertname }}
            {{ else }}&#9898 <b>Alert:</b> {{ .CommonLabels.alertname }}
            {{ end }}
            <b>Status:</b> &#x1F525 FIRING
            <b>Severity:</b> {{ if eq .CommonLabels.severity "critical" }}&#128308 <i>{{ .CommonLabels.severity | title }}</i>
            {{ else if eq .CommonLabels.severity "warning" }}&#128992 <i>{{ .CommonLabels.severity | title }}</i>
            {{ else }}&#9898 <i>{{ .CommonLabels.severity | title }}</i>
            {{ end }}
          {{ else if eq .Status "resolved" }}
            {{ if eq .CommonLabels.severity "critical" }}&#128994 <b>Alert:</b> {{ .CommonLabels.alertname }}
            {{ else if eq .CommonLabels.severity "warning" }}&#128994 <b>Alert:</b> {{ .CommonLabels.alertname }}
            {{ else }}&#9898 <b>Alert:</b> {{ .CommonLabels.alertname }}
            {{ end }}
            <b>Status:</b> &#x2705 RESOLVED
            <b>Severity:</b> {{ if eq .CommonLabels.severity "critical" }}&#128994 <i>{{ .CommonLabels.severity | title }}</i>
            {{ else if eq .CommonLabels.severity "warning" }}&#128994 <i>{{ .CommonLabels.severity | title }}</i>
            {{ else }}&#9898 <i>{{ .CommonLabels.severity | title }}</i>
            {{ end }}
          {{ end }}
          {{ range .Alerts }}
            {{ if .Labels.instance }}<b>Instance:</b> {{ .Labels.instance }}{{ end }}
            {{ if .Annotations.summary }}<b>Summary:</b> {{ .Annotations.summary }}{{ end }}
            {{ if .Annotations.description }}<b>Description:</b> {{ .Annotations.description }}{{ end }}
          {{ end }}
          {{ end }}
      ingress:
        enabled: true
        hosts:
          - alertmanager.192.168.31.8.sslip.io
        ingressClassName: nginx
      alertmanagerSpec:
        secrets:
          - alertmanager-secret-files
        replicas: 3
        podAntiAffinity: "hard"
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: "local-path"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Mi
        resources:
          limits:
            cpu: 400m
            memory: 400Mi
          requests:
            cpu: 200m
            memory: 200Mi
    prometheus:
      ingress:
        enabled: true
        hosts:
          - prometheus.192.168.31.8.sslip.io
        ingressClassName: nginx
      prometheusSpec:
        replicas: 2
        podAntiAffinity: "hard"
        retention: 7d
        retentionSize: 5GB
        serviceMonitorSelectorNilUsesHelmValues: false
        resources:
          limits:
            cpu: 400m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: "local-path"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
    prometheusOperator:
      enabled: true
      resources:
        limits:
          cpu: 200m
          memory: 200Mi
        requests:
          cpu: 100m
          memory: 100Mi
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kube-state-metrics:
      enabled: true
      resources:
        limits:
          cpu: 50m
          memory: 256Mi
        requests:
          cpu: 25m
          memory: 128Mi
    prometheus-node-exporter:
      enabled: true
      resources:
        requests:
          cpu: 75m
          memory: 100Mi
        limits:
          cpu: 150m
          memory: 200Mi
  valuesFrom:
    - kind: Secret
      name: prometheus-stack-credentials
      valuesKey: grafana_admin_password
      targetPath: grafana.adminPassword
      optional: false
