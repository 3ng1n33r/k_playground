---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: 69.6.0
  dependsOn:
    - name: sealed-secrets-controller
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
  interval: 30m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  values:
    grafana:
      enabled: true
      defaultDashboardsEnabled: true
      ingress:
        enabled: true
        hosts:
        - grafana.192.168.31.8.sslip.io
        ingressClassName: nginx
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
          labelValue: "1"
    alertmanager:
      enabled: true
      config:
        global:
          telegram_api_url: "https://api.telegram.org"
        route:
          receiver: telegram-alert
          group_by: ['alertname', 'cluster', 'service']
          repeat_interval: 1h
          routes:
            - match:
                severity: critical
              receiver: telegram-alert
              continue: true
        receivers:
          - name: telegram-alert
        telegram_configs:
          - api_url: "https://api.telegram.org"
            bot_token_file: /etc/alertmanager/secrets/alertmanager-secret-files/telegram-bot-token
            chat_id: -880628191
            send_resolved: true
            parse_mode: "MarkdownV2"
      ingress:
        enabled: true
        hosts:
        - alertmanager.192.168.31.8.sslip.io
        ingressClassName: nginx
      alertmanagerSpec:
        secrets:
          - alertmanager-secret-files
        replicas: 1
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: "local-path"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Mi
        resources:
          limits:
            cpu: 500m
            memory: 400Mi
          requests:
            cpu: 250m
            memory: 200Mi
    prometheus:
      ingress:
        enabled: true
        hosts:
        - prometheus.192.168.31.8.sslip.io
        ingressClassName: nginx
      prometheusSpec:
        replicas: 1
        retention: 7d
        retentionSize: 5GB
        serviceMonitorSelectorNilUsesHelmValues: false
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: "local-path"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
    prometheusOperator:
      enabled: true
      resources: 
        limits:
          cpu: 200m
          memory: 200Mi
        requests:
          cpu: 100m
          memory: 100Mi
  valuesFrom:
    - kind: Secret
      name: prometheus-stack-credentials
      valuesKey: grafana_admin_password
      targetPath: grafana.adminPassword
      optional: false
