---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: flux-system
spec:
  chart:
    spec:
      chart: grafana
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana
      version: 8.5.12
  dependsOn:
    - name: sealed-secrets-controller
  interval: 30m
  releaseName: grafana
  targetNamespace: monitoring
  values:
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
      resources:
        limits: 
          cpu: 100m
          memory: 100Mi
        requests:
          cpu: 50m
          memory: 50Mi
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
        - access: proxy
          isDefault: true
          editable: true
          name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local
        - access: proxy
          editable: true
          name: Alertmanager
          type: alertmanager
          url: http://prometheus-alertmanager.monitoring.svc.cluster.local:9093
    ingress:
      enabled: true
      hosts:
      - grafana.192.168.31.8.sslip.io
      ingressClassName: nginx
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  valuesFrom:
    - kind: Secret
      name: grafana-credentials
      valuesKey: grafana_admin_password
      targetPath: adminPassword
      optional: false
