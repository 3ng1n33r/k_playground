---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  chart:
    spec:
      chart: prometheus
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus
      version: 26.0.0
  interval: 30m
  releaseName: prometheus
  targetNamespace: monitoring
  values:
    alertmanager:
      enabled: true
      persistence:
        size: 100Mi
      replicaCount: 3
      resources:
        limits:
          cpu: 500m
          memory: 400Mi
        requests:
          cpu: 250m
          memory: 200Mi
      extraSecretMounts:
        - name: secret-files
          mountPath: /etc/secrets
          subPath: ""
          secretName: alertmanager-secret-files
          readOnly: true
      config:
        enabled: true
        global:
          resolve_timeout: 5m
        receivers:
          - name: default-receiver
            telegram_configs:
            - api_url: https://api.telegram.org
              bot_token_file: /etc/secrets/telegram-bot-token
              chat_id: "-880628191"
              disable_notifications: false
              send_resolved: true
              parse_mode: HTML
        route:
          group_interval: 5m
          group_wait: 30s
          receiver: default-receiver
          repeat_interval: 3h
        templates:
          - /etc/alertmanager/*.tmpl
    kube-state-metrics:
      enabled: true
      resources:
        limits:
          cpu: 50m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 128Mi
    prometheus-node-exporter:
      enabled: true
      resources:
        limits:
          cpu: 200m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
    prometheus-pushgateway:
      enabled: false
    server:
      ingress:
        enabled: true
        hosts:
        - prometheus.192.168.31.8.sslip.io
        ingressClassName: nginx
      persistentVolume:
        enabled: true
        size: 5Gi
      replicaCount: 2
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi
      retention: 7d
      retentionSize: 5GB
      extraConfigmapMounts:
        - name: prometheus-alerts
          mountPath: /etc/alerts.d
          subPath: ""
          configMap: prometheus-alerts
          readOnly: true
    serverFiles:
      prometheus.yml:
        rule_files:
          - /etc/alerts.d/alerting_rules.yml
