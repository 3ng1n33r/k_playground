---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  chart:
    spec:
      chart: prometheus
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus
      version: 26.0.1
  dependsOn:
    - name: sealed-secrets-controller
  interval: 30m
  releaseName: prometheus
  targetNamespace: monitoring
  values:
    kube-state-metrics:
      enabled: true
      resources:
        limits:
          cpu: 50m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 128Mi
    prometheus-node-exporter:
      enabled: true
      resources:
        limits:
          cpu: 200m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
    prometheus-pushgateway:
      enabled: false
    server:
      ingress:
        enabled: true
        hosts:
        - prometheus.192.168.31.8.sslip.io
        ingressClassName: nginx
      persistentVolume:
        enabled: true
        size: 5Gi
        storageClass: "local-path"
      replicaCount: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi
      retention: 7d
      retentionSize: 5GB
      extraConfigmapMounts:
        - name: prometheus-alerts
          mountPath: /etc/alerts.d
          subPath: ""
          configMap: prometheus-alerts
          readOnly: true
    serverFiles:
      prometheus.yml:
        rule_files:
          - /etc/alerts.d/alerting_rules.yml
    alertmanager:
      replicaCount: 1
      persistence:
        enabled: true
        size: 50Mi
        storageClass: "local-path"
      resources:
        limits:
          cpu: 500m
          memory: 400Mi
        requests:
          cpu: 250m
          memory: 200Mi
      extraSecretMounts:
        - name: secret-files
          mountPath: /etc/secrets
          subPath: ""
          secretName: alertmanager-secret-files
          readOnly: true
      config:
        enabled: true
        global:
          resolve_timeout: 5m
        route:
          group_interval: 5m
          group_wait: 10s
          group_by: ['alertname']
          receiver: 'telegram'
          repeat_interval: 3h
        templates:
          - '/etc/alertmanager/*.tmpl'
        receivers:
        - name: 'telegram'
          telegram_configs:
          - api_url: https://api.telegram.org
            bot_token_file: /etc/secrets/telegram-bot-token
            chat_id: -880628191
            disable_notifications: false
            send_resolved: true
            parse_mode: 'HTML'
            message: '{{ template "telegram.message" .}}'
      templates:
          telegram.tmpl: |-
            {{ define "__tg_text_alert_list" }}{{ range . }}
            ---
            <b>{{ .Labels.alertname }}</b>
            {{- if .Annotations.summary }}
            {{ .Annotations.summary }}{{ end }}
            {{- if .Annotations.description }}
            {{ .Annotations.description }}{{ end }}
            Labels:
            {{ range .Labels.SortedPairs }}  <i>{{ .Name }}</i>: <code>{{ .Value }}</code>
            {{ end }}{{ end }}
            <a href="http://prometheus.192.168.31.8.sslip.io/alerts">View active alerts</a>
            {{ end }}

            {{ define "telegram.message" }}
            {{ if gt (len .Alerts.Firing) 0 }}
            Alerts Firing:
            {{ template "__tg_text_alert_list" .Alerts.Firing }}
            {{ end }}
            {{ if gt (len .Alerts.Resolved) 0 }}
            Alerts Resolved:
            {{ template "__tg_text_alert_list" .Alerts.Resolved }}
            {{ end }}
            {{ end }}
