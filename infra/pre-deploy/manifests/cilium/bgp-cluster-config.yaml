---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
  - name: home
    localASN: 65010
    peers:
    - name: openwrt
      peerASN: 65000
      peerAddress: 192.168.31.1
      peerConfigRef:
        name: openwrt-peer
